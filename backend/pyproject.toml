[project]
name = "luxion-backend"
version = "0.1.0"
description = "Luxion personal AI agent - Python backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pillow>=10.0",
    "psutil>=5.9",
    # Windows has no system tz database; zoneinfo needs this for IANA zones.
    "tzdata>=2024.1",
    # Voice (Phase 4): mic capture / WAV playback, Whisper STT, Windows TTS.
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0",
    "pyttsx3>=2.98",
    # Memory + RAG (Phase 5): ONNX embeddings, SQLite vector + FTS5 search.
    "fastembed>=0.8",
    "sqlite-vec>=0.1.9",
    # Browser agent (Phase 6): Playwright drives Chromium for the browser_*,
    # youtube_* tools. Run `python -m playwright install chromium` once after
    # install; the manager degrades to a clear ToolError until then.
    "playwright>=1.40",
    # Computer automation (Phase 7): the desktop_* tools — UI Automation tree
    # + element clicks (pywinauto) and Core Audio volume (pycaw, needs
    # comtypes/pywin32 which pywinauto already pulls in).
    "pywinauto>=0.6.8",
    "pycaw>=20260927",
    # Vision + hardware (Phase 11b): webcam capture and face/SFace foundations
    # (opencv-contrib), exact-text OCR via ONNX Runtime (rapidocr).
    "opencv-contrib-python>=4.10",
    "rapidocr-onnxruntime>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["luxion*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
